<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,600;0,700;0,800&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --deep-space:#08101E;--klein-blue:#002FA7;--amber-gold:#E5A820;
  --cobalt-shade:#243B6E;--muted-blue:#B8CBE8;--muted-ink:#3A4F7A;
  --card-dark:#0D1826;--card-border:#1E3055;
  --font-head:'Plus Jakarta Sans',sans-serif;--font-body:'Inter',sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smoothoverflow-x:hidden;}
body{
  font-family:var(--font-body);
  background:var(--deep-space);color:#fff;
  min-height:100vh;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  text-align:center;padding:40px 24px;
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
a{text-decoration:none;color:inherit}

/* Background grid */
body::before{
  content:'';position:fixed;inset:0;
  background-image:linear-gradient(var(--card-border) 1px,transparent 1px),
    linear-gradient(90deg,var(--card-border) 1px,transparent 1px);
  background-size:60px 60px;
  opacity:.25;pointer-events:none;z-index:0;
}

.content{position:relative;z-index:1;max-width:560px;width:100%}

.logo-wrap{margin-bottom:48px}
.logo-wrap img{height:40px;margin:0 auto}

.code-404{
  font-family:var(--font-head);
  font-size:clamp(96px,20vw,160px);
  font-weight:800;line-height:1;
  letter-spacing:-.04em;
  background:linear-gradient(135deg,var(--klein-blue) 0%,var(--muted-blue) 50%,var(--amber-gold) 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;
  animation:shimmer 4s ease-in-out infinite alternate;
  background-size:200% 200%;
}
@keyframes shimmer{
  0%{background-position:0% 50%}
  100%{background-position:100% 50%}
}

.headline{
  font-family:var(--font-head);
  font-size:clamp(22px,4vw,32px);
  font-weight:800;line-height:1.2;
  color:#fff;margin:20px 0 12px;
}

.subtext{
  font-size:16px;line-height:1.7;
  color:var(--muted-blue);margin-bottom:40px;
}

.cta-group{
  display:flex;gap:14px;justify-content:center;flex-wrap:wrap;
  margin-bottom:56px;
}
.btn-gold{position:relative;display:inline-flex;align-items:center;gap:8px;background:transparent;color:var(--amber-gold);font-family:var(--font-head);font-size:15px;font-weight:700;padding:14px 28px;border-radius:var(--r-md,8px);border:2px solid var(--amber-gold);white-space:nowrap;transition:color .4s;z-index:0;overflow:hidden}
.btn-gold::before{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;background:var(--amber-gold);transition:left .4s cubic-bezier(.4,0,.2,1);z-index:-1}
.btn-gold:hover{color:var(--deep-space,#08101E)}
.btn-gold:hover::before{left:0}


.btn-ghost{position:relative;display:inline-flex;align-items:center;gap:8px;background:transparent;color:#fff;font-family:var(--font-head);font-size:15px;font-weight:600;padding:14px 28px;border-radius:var(--r-md,8px);border:1.5px solid rgba(255,255,255,.55);transition:color .35s,border-color .35s;z-index:0;overflow:hidden}
.btn-ghost::after{content:'';position:absolute;inset:0;background:#fff;transform:scaleX(0);transform-origin:left;transition:transform .35s cubic-bezier(.4,0,.2,1);z-index:-1}
.btn-ghost:hover{color:#08101E;border-color:#fff}
.btn-ghost:hover::after{transform:scaleX(1)}



.quick-links{
  display:flex;gap:24px;justify-content:center;flex-wrap:wrap;
}
.quick-links a{
  font-family:var(--font-head);font-size:13px;font-weight:600;
  color:var(--muted-blue);
  transition:color .2s;
}
.quick-links a:hover{color:#fff}

/* Floating orbs */
.orb{
  position:fixed;border-radius:50%;pointer-events:none;z-index:0;
  filter:blur(80px);opacity:.18;animation:drift 12s ease-in-out infinite alternate;
}
.orb-1{width:400px;height:400px;background:var(--klein-blue);top:-100px;right:-100px}
.orb-2{width:300px;height:300px;background:var(--amber-gold);bottom:-80px;left:-80px;animation-delay:-6s}
@keyframes drift{0%{transform:translate(0,0)}100%{transform:translate(30px,20px)}}

.nav-logo{flex-shrink:0}
.nav-logo img{height:52px;width:auto}

/* Nav CTA: same line as menu, at far right edge, Option 5 styling */
.nav-right .btn-gold,.nav-actions .nav-cta{position:fixed!important;top:14px;right:20px;z-index:1100;font-weight:800!important;font-size:13px!important;padding:10px 18px!important;letter-spacing:.02em;background:transparent!important;color:var(--amber-gold,#E5A820)!important;border:2px solid var(--amber-gold,#E5A820)!important;border-radius:8px!important;overflow:hidden;display:inline-flex;align-items:center;gap:8px;box-shadow:0 6px 24px rgba(229,168,32,.18);transition:color .4s}
/* Reserve right space in non-scrolled nav so menu items dont fall under CTA */
#navbar:not(.scrolled) .nav-inner{padding-right:170px!important}
.nav-right .btn-gold::before,.nav-actions .nav-cta::before{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;background:var(--amber-gold,#E5A820);transition:left .4s cubic-bezier(.4,0,.2,1);z-index:-1}
.nav-right .btn-gold:hover,.nav-actions .nav-cta:hover{color:#08101E!important}
.nav-right .btn-gold:hover::before,.nav-actions .nav-cta:hover::before{left:0}
/* Hide CTA when nav scrolled (pill state) — user requested no clutter on scroll */
#navbar.scrolled .nav-right .btn-gold,#navbar.scrolled .nav-actions .nav-cta{opacity:0!important;visibility:hidden!important;pointer-events:none!important;transform:translateX(30px)!important;transition:opacity .3s ease,visibility .3s ease,transform .3s ease}
.nav-right .btn-gold,.nav-actions .nav-cta{transition:opacity .3s ease,visibility .3s ease,transform .3s ease,color .4s ease}
@media(max-width:1180px){
  .nav-right .btn-gold,.nav-actions .nav-cta{display:none!important}
  #navbar:not(.scrolled) .nav-inner{padding-right:40px!important}
}

/* ========================================================
   UNIFIED BUTTON SYSTEM — Option 2 (White Ghost Slide) ONLY
   Overrides every old btn-gold/blue/ghost/ghost-dark + nav CTA
   ======================================================== */
.btn-gold,.btn-blue,.btn-ghost,.btn-ghost-dark,.nav-right .btn-gold,.nav-actions .nav-cta{
  position:relative!important;display:inline-flex!important;align-items:center!important;gap:8px!important;
  background:transparent!important;color:#fff!important;
  font-family:var(--font-head)!important;font-size:15px!important;font-weight:700!important;letter-spacing:.02em!important;
  padding:14px 28px!important;border-radius:8px!important;
  border:1.5px solid rgba(255,255,255,.55)!important;
  transition:color .35s ease,border-color .35s ease!important;
  z-index:0;overflow:hidden!important;text-decoration:none!important;
  box-shadow:none!important;
}
.btn-gold::before,.btn-blue::before,.btn-ghost::before,.btn-ghost-dark::before,.nav-right .btn-gold::before,.nav-actions .nav-cta::before{display:none!important}
.btn-gold::after,.btn-blue::after,.btn-ghost::after,.btn-ghost-dark::after,.nav-right .btn-gold::after,.nav-actions .nav-cta::after{
  content:''!important;position:absolute!important;inset:0!important;
  background:#fff!important;
  transform:scaleX(0)!important;transform-origin:left!important;
  transition:transform .35s cubic-bezier(.4,0,.2,1)!important;
  z-index:-1!important;
}
.btn-gold:hover,.btn-blue:hover,.btn-ghost:hover,.btn-ghost-dark:hover,.nav-right .btn-gold:hover,.nav-actions .nav-cta:hover{
  color:#08101E!important;border-color:#fff!important;
}
.btn-gold:hover::after,.btn-blue:hover::after,.btn-ghost:hover::after,.btn-ghost-dark:hover::after,.nav-right .btn-gold:hover::after,.nav-actions .nav-cta:hover::after{
  transform:scaleX(1)!important;
}
/* Keep nav CTA fixed positioning */
.nav-right .btn-gold,.nav-actions .nav-cta{position:fixed!important;top:14px!important;right:20px!important;z-index:1100!important;font-size:13px!important;font-weight:800!important;padding:10px 18px!important}
/* Hide nav CTA when scrolled */
#navbar.scrolled .nav-right .btn-gold,#navbar.scrolled .nav-actions .nav-cta{opacity:0!important;visibility:hidden!important;pointer-events:none!important;transform:translateX(30px)!important}
/* Hide nav CTA on narrow viewports */
@media(max-width:1180px){.nav-right .btn-gold,.nav-actions .nav-cta{display:none!important}#navbar:not(.scrolled) .nav-inner{padding-right:40px!important}}
</style>
